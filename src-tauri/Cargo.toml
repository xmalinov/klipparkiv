[package]
name = "klipparkiv"
version = "1.7.0"
description = "Offline media library for backing tracks and lessons: audio, video, clips and playlists"
authors = ["Klipparkiv contributors"]
edition = "2024"
default-run = "klipparkiv"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klipparkiv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "sync", "time"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
walkdir = "2.5.0"
base64 = "0.23.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-notification = "2.8.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"
sha2 = "0.11"
hex = "0.4"
minisign-verify = "0.3"
url = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
plist = "1"
cpal = "0.18"
beat-this = { version = "1.1.0", default-features = false }
arc-swap = "1.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
