[package]
name = "klipparkiv"
version = "1.1.0"
description = "Portable Windows GUI for yt-dlp: audio, video, clips and a library of downloads"
authors = ["Klipparkiv contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klipparkiv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
walkdir = "2.5.0"
base64 = "0.23.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-notification = "2.8.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
