name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — download bugs are
        hard to reproduce without the exact URL type and the log output.
  - type: input
    id: version
    attributes:
      label: Klipparkiv version
      description: Shown in Settings, or the name of the zip you unpacked.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ytdlp
    attributes:
      label: yt-dlp version
      description: Shown in the status bar or in Settings.
      placeholder: "2026.10.26"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 x64"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Download mode
      options:
        - Audio (MP3)
        - Video (MP4)
        - Audio + Video
        - Clip
        - Batch from file
        - Library / UI only
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste https://...
        2. Choose 1080p
        3. Press Download
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error text and the last lines of the log if possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Files live in `data\` next to the executable. Remove anything private
        (tokens, cookies, personal paths) before pasting.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am on the latest Klipparkiv release.
          required: true
        - label: I tried updating yt-dlp first (Settings → Update yt-dlp).
          required: true
        - label: This is not a request to download content I have no rights to.
          required: true
