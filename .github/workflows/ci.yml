name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests and coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: error

      - name: Frontend build
        run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-15-intel
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # cargo-llvm-cov 0.9.1 cannot read Rust 1.100 coverage on Windows.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      # Coverage and the ffmpeg-gated Windows tests need the bundled tools.
      - name: Download yt-dlp and FFmpeg into bin\
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          $dst = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive $zip -DestinationPath $dst
          $ffmpeg = Get-ChildItem $dst -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem $dst -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "bin/ffprobe.exe"

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-llvm-cov
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@cargo-llvm-cov

      # Coverage is measured on Windows only: the macOS matrix is expensive and
      # platform-gated macOS tests still run in the regular test step.
      - name: Rust coverage
        if: runner.os == 'Windows'
        run: >
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --all-targets
          --fail-under-lines 66 --lcov --output-path src-tauri/lcov.info

      - name: Upload Rust coverage
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: src-tauri/lcov.info
          if-no-files-found: error
